[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "nixbot"
version = "181"
authors = [
    {name = "Bart Thate", email = "nixtniet@gmail.com" },
]
description = "NIXBOT"
readme = "README.rst"
license = "Unlicense"
classifiers=[
    'Development Status :: 3 - Alpha',
    'Operating System :: Unix',
    'Programming Language :: Python :: 3',
    'Topic :: Utilities'
]


[project.scripts]
"nixbot" = "nixbot.runtime:main"


[project.urls]
"home" = "https://pypi.org/project/nixbot"
"bugs" = "https://github.com/nixtniet/nixbot/issues"
"source" = "https://github.com/nixtniet/nixbot"


[tool.setuptools]
packages = [
    'nixbot', 
    'nixbot.modules'
]


[tool.pylint."messages control"]
disable = [
    'R',
    'attribute-defined-outside-init',
    'broad-exception-caught',
    'invalid-name',
    'import-outside-toplevel',
    'line-too-long',
    'protected-access',
    'relative-beyond-top-level',
    'unused-argument',
    'wrong-import-position'
]


[tool.ruff.lint]
preview = true
ignore = [
    'DTZ',
    'deprecated-import',
    'blind-except',
    'invalid-all-format',
    'mutable-class-default',
    'non-pep585-annotation',
    'non-pep604-annotation-union',
    'unsorted-imports',
    'verbose-log-message'
]


[tool.mypy]
disable_error_code = [
    'annotation-unchecked',
    'var-annotated'
]
